version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Build independently. No service or runtime crate depends on this probe.
[workspace]

[dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
