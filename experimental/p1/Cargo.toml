[workspace]
members = [
    "crates/domain",
    "crates/ports",
    "crates/application",
    "crates/sqlite",
    "crates/test-support",
    "crates/m3-lab",
    "crates/ipc",
    "crates/test-support/ipc",
]
resolver = "3"

[workspace.package]
version = "0.1.0-foundation.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
yixu-domain = { path = "crates/domain" }
yixu-ports = { path = "crates/ports" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
