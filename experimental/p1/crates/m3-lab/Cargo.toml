[package]
name = "yixu-m3-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dev-dependencies]
yixu-domain.workspace = true
yixu-ports.workspace = true
yixu-application = { path = "../application" }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
zeroize = "=1.9.1"
getrandom = "=0.4.3"
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "deny"
