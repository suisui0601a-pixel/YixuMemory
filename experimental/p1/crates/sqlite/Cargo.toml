[package]
name = "yixu-sqlite-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
yixu-domain.workspace = true
yixu-ports.workspace = true
rusqlite.workspace = true
sha2.workspace = true
[dev-dependencies]
chacha20poly1305 = { version = "=0.10.1", default-features = false }
zeroize = "=1.9.1"
hmac = "=0.13.0"
getrandom = "=0.4.3"
tempfile.workspace = true
yixu-application = { path = "../application" }
yixu-sqlite-test-support = { path = "../test-support", features = ["synthetic-fixtures"] }
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "deny"
